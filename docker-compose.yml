services:
  mysql:
    image: mysql:8
    container_name: muleobara
    restart: always
    ports:
      - "3307:3306"
    volumes:
      - muleobara-db:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: muleobara
      TZ: Asia/Seoul

  redis:
    image: redis:latest
    container_name: muleobara-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  muleobara-db:
  redis-data:
